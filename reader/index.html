<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GutS Reader</title>
    <style>
        body { 
            margin: 0; 
            background-color: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        img { 
            width: 100%; 
            max-width: 800px; 
            display: block;
            margin-bottom: -1px; /* Biar kaga ada garis putus antar gambar */
        }
        .error {
            color: white;
            font-family: sans-serif;
            margin-top: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const base = urlParams.get('base');
        const path = urlParams.get('path');
        const imgs = urlParams.get('imgs');

        if (base && path && imgs) {
            const reader = document.getElementById('reader');
            const imgArray = imgs.split(',');
            
            imgArray.forEach(imgFile => {
                const img = document.createElement('img');
                img.src = `${base}${path}${imgFile}`;
                img.loading = "lazy";
                reader.appendChild(img);
            });
        } else {
            document.body.innerHTML = '<h2 class="error">Data komik tidak ditemukan atau link kadaluarsa.</h2>';
        }
    </script>
</body>
</html>
