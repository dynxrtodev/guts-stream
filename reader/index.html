<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>GutS Reader</title>
    <style>
        body { 
            margin: 0; 
            background-color: #1a1a1a; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        img { 
            width: 100%; 
            max-width: 800px; 
            display: block;
            margin-bottom: -1px; 
        }
        .error {
            color: white;
            font-family: sans-serif;
            margin-top: 50px;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const baseRaw = urlParams.get('base');
        const pathRaw = urlParams.get('path');
        const imgsRaw = urlParams.get('imgs');

        if (imgsRaw) {
            const reader = document.getElementById('reader');
            // Decode the URI component in case the bot encoded it heavily
            const imgArray = decodeURIComponent(imgsRaw).split(',');
            
            imgArray.forEach(imgFile => {
                if (!imgFile) return; // Skip empty strings
                
                const img = document.createElement('img');
                const cleanImgFile = imgFile.trim();

                // If it is an absolute URL (starts with http/https or //)
                if (cleanImgFile.startsWith('http') || cleanImgFile.startsWith('//')) {
                    img.src = cleanImgFile.startsWith('//') ? 'https:' + cleanImgFile : cleanImgFile;
                } else {
                    // Fallback for Shinigami/Komikku legacy logic
                    const base = baseRaw ? decodeURIComponent(baseRaw) : '';
                    const path = pathRaw ? decodeURIComponent(pathRaw) : '';
                    img.src = path ? `${base}/${path}/${cleanImgFile}` : `${base}/${cleanImgFile}`;
                }
                
                img.loading = "lazy";
                
                // Add an error listener to show broken image icons instead of crashing
                img.onerror = function() {
                    this.style.display = 'none';
                    console.error('Failed to load image:', this.src);
                };
                
                reader.appendChild(img);
            });
        } else {
            document.body.innerHTML = '<h2 class="error">Data komik tidak ditemukan atau link kadaluarsa.</h2>';
        }
    </script>
</body>
</html>
