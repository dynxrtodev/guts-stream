<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GutS Player</title>
    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .video-js { width: 100vw; height: 100vh; }
    </style>
</head>
<body>

    <video-js id="my-video" class="video-js vjs-default-skin" controls preload="auto">
        <p class="vjs-no-js">To view this video please enable JavaScript.</p>
    </video-js>

    <!-- Video.js JS -->
    <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        // Ambil URL m3u8 dari parameter
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('url');

        if (streamUrl) {
            const player = videojs('my-video');
            player.src({
                src: decodeURIComponent(streamUrl),
                type: 'application/x-mpegURL'
            });
            player.play();
        } else {
            alert("No stream URL provided!");
        }
    </script>
</body>
</html>
